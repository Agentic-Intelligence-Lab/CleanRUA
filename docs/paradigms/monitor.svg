<svg xmlns="http://www.w3.org/2000/svg" width="400" height="78" viewBox="0 0 400 78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Monitor: the MLLM sends a go on / correct to VLA + task instruction, which moves the robot; images and state return</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="77" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="10" y="14" width="74" height="28" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="47" y="28" font-size="13" fill="#1f2328" text-anchor="middle" dominant-baseline="central">MLLM</text>
  <line x1="84" y1="28" x2="167" y2="28" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="126" y="21" font-size="11" fill="#57606a" text-anchor="middle">go on / correct</text>
  <rect x="169" y="14" width="140" height="28" rx="5" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
  <text x="239" y="28" font-size="12" fill="#1f2328" text-anchor="middle" dominant-baseline="central">VLA + task instruction</text>
  <line x1="309" y1="28" x2="325" y2="28" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="327" y="14" width="63" height="28" rx="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="358.5" y="28" font-size="13" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Robot</text>
  <path d="M358.5,42 V58 H47 V44" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="202" y="70" font-size="11" fill="#57606a" text-anchor="middle">images, state</text>
</svg>
