site_name: CleanRUA
site_description: Clean, single-file implementations of robot-use agents
site_url: https://cleanrua.agentic-intelligence-lab.org/
repo_url: https://github.com/Agentic-Intelligence-Lab/CleanRUA
repo_name: Agentic-Intelligence-Lab/CleanRUA
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 CleanRUA authors · MIT License

theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Overview: index.md
  - Get Started:
      - Installation:
          - RoboDojo: get-started/installation_robodojo.md
          - DexJoCo: get-started/installation_dexjoco.md
      - Evaluation: get-started/evaluation.md
  - RUA Algorithms:
      - Overview: algorithms/overview.md
      - Direct: algorithms/direct.md
      - CaP: algorithms/cap.md
      - Delegate: algorithms/delegate.md
      - Monitor: algorithms/monitor.md
  - Environments:
      - RoboDojo: environments/robodojo.md
      - DexJoCo: environments/dexjoco.md
  - Community:
      - Contribution: contributing.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/charts.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Agentic-Intelligence-Lab/CleanRUA

exclude_docs: |
  requirements.txt
  logo.jpg
