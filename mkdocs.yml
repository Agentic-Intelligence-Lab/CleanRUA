site_name: CleanRUA
site_description: Clean, single-file implementations of robot-use agents
site_url: https://agentic-intelligence-lab.github.io/CleanRUA/
repo_url: https://github.com/Agentic-Intelligence-Lab/CleanRUA
repo_name: Agentic-Intelligence-Lab/CleanRUA
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 CleanRUA authors · MIT License

theme:
  name: material
  logo: logo.jpg
  favicon: logo.jpg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Get started:
      - Installation: get-started/installation.md
  - Algorithms:
      - Overview: algorithms/overview.md
      - Direct: algorithms/direct.md
      - Code: algorithms/code.md
      - Delegate: algorithms/delegate.md
      - Monitor: algorithms/monitor.md
  - Environments:
      - RoboDojo: environments/robodojo.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Agentic-Intelligence-Lab/CleanRUA

exclude_docs: |
  requirements.txt
